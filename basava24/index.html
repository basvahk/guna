<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe v1- MULTI MODE </title>
<style>
body{font-family:Arial;text-align:center;background:#f0f0f0;}
table{border-collapse:collapse;margin:20px auto;}
td{width:100px;height:100px;border:3px solid #333;text-align:center;font-size:2em;cursor:pointer;}
td:hover{background:#ddd;}
#status{font-size:1.5em;margin:20px;}
button{padding:10px 20px;font-size:1.2em;margin:5px;}
</style>
</head>

<body>

<h1>🕹️ Tic Tac Toe V1 </h1>

<button onclick="toggleMode()">Switch to Man vs Man</button>
<table id="board">
<tr><td></td><td></td><td></td></tr>
<tr><td></td><td></td><td></td></tr>
<tr><td></td><td></td><td></td></tr>
</table>

<div id="status">Your Turn (X)</div>
<button onclick="resetGame()">New Game</button>

<script>

let board = Array(9).fill(null);
let currentPlayer = 'X';
let gameActive = true;

/* ✅ Game Mode */
let gameMode = "AI"; // AI or MAN

const winningCombos = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

document.querySelectorAll('td')
.forEach((cell,index)=>cell.onclick=()=>makeMove(index));

function toggleMode(){

if(gameMode === "AI"){
gameMode = "MAN";
document.querySelector("button").textContent = "Switch to Man vs AI";
document.getElementById('status').textContent = "Player X's Turn";
}else{
gameMode = "AI";
document.querySelector("button").textContent = "Switch to Man vs Man";
document.getElementById('status').textContent = "Your Turn (X)";
}

resetGame();
}

function makeMove(index){

if(board[index] || !gameActive) return;

/* MAN vs AI */
if(gameMode === "AI"){

if(currentPlayer !== 'X') return;

board[index] = 'X';
document.querySelectorAll('td')[index].textContent = 'X';

checkWin();

if(gameActive){
currentPlayer = 'O';
document.getElementById('status').textContent = "AI Thinking...";
setTimeout(aiMove, 500);
}

}
/* MAN vs MAN */
else{

board[index] = currentPlayer;
document.querySelectorAll('td')[index].textContent = currentPlayer;

checkWin();

if(gameActive){
currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
document.getElementById('status').textContent =
`Player ${currentPlayer}'s Turn`;
}
}
}

/* 🤖 AI MOVE */
function aiMove(){

let emptyCells = board
.map((val,index)=> val===null ? index : null)
.filter(val=>val!==null);

if(emptyCells.length === 0) return;

let randomIndex =
emptyCells[Math.floor(Math.random()*emptyCells.length)];

board[randomIndex] = 'O';
document.querySelectorAll('td')[randomIndex].textContent = 'O';

checkWin();

if(gameActive){
currentPlayer = 'X';
document.getElementById('status').textContent = "Your Turn (X)";
}
}

function checkWin(){

for(let combo of winningCombos){
let [a,b,c] = combo;

if(board[a] && board[a]===board[b] && board[a]===board[c]){

document.getElementById('status').textContent =
`Player ${board[a]} Wins! 🎉`;

gameActive = false;
return;
}
}

if(!board.includes(null)){
document.getElementById('status').textContent = "Draw! 🤝";
gameActive = false;
}
}

function resetGame(){
board.fill(null);
document.querySelectorAll('td')
.forEach(td=>td.textContent='');
currentPlayer='X';
gameActive=true;

if(gameMode === "AI")
document.getElementById('status').textContent="Your Turn (X)";
else
document.getElementById('status').textContent="Player X's Turn";
}

</script>
</body>
</html>
